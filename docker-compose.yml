services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 2s
      retries: 30

  mock:
    build: .
    command: ["uvicorn", "mock_provider.app:app", "--host", "0.0.0.0", "--port", "9000", "--no-access-log"]
    ports: ["9000:9000"]

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    profiles: [ollama]

  gateway:
    build: .
    env_file: [{path: .env, required: false}]
    environment:
      GATEWAY_DATABASE_URL: postgresql://gateway:gateway@postgres:5432/gateway
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      mock: {condition: service_started}

volumes:
  pgdata:
  ollama:
