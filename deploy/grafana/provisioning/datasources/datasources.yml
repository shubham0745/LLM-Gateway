apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Postgres
    uid: postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: gateway
    jsonData:
      database: gateway
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: gateway
